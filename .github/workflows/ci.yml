# CI for proglib. Mirrors tools/ci.sh (the local entry point — keep in sync).
# The SV differential harness runs against Xcelium (`xrun`) where it exists
# (self-hosted) and otherwise against Icarus Verilog (`iverilog`, installed
# below via apt); tools/ci.sh auto-skips it only when neither simulator is
# present, so this workflow is safe on stock GitHub runners.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

# Superseded pushes do not need to consume a hosted runner, except on master:
# there a run in progress is left to finish, and a newer push waits (only the
# newest waiting run is kept), so that master gets completed results. With
# cancellation on master too, 195 of the last 200 master runs were cancelled
# and none completed after 2026-11-09. Keep one active workflow per ref and
# bound the full check if a tool or dependency hangs.
concurrency:
  # Scheduled runs have their own lane, so the nightly baseline never waits
  # behind a push and a manual dispatch can start the first completion now.
  group: ${{ github.event_name == 'schedule' && 'ci-nightly' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # The step limit is below the job limit so that the build is still saved
    # when the check runs out of time.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (pinned toolchain comes from lean-toolchain)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The Python differential oracle is pinned to CPython 3.9
      # (harness/diff_test.py re-execs under python3.9; the coverage page
      # refuses any other oracle). Listing 3.12 last keeps it the default
      # python3, as on a stock runner.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.12
      # Restore the newest build of this toolchain and save again at the end
      # even when the check fails or times out. A cache saved only on success
      # was never saved: a cold full build does not fit the time limit, so no
      # run completed and every run started cold again.
      - name: Restore lake build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-
      - name: Notebook and pinned SV frontend dependencies
        run: |
          python3 -m pip install --user nbformat nbclient jupyter-core ipykernel
          # SV extraction (notebook 03 + extractors/sv) runs under python3.12 + pyslang.
          python3.12 -m pip install --user 'pyslang>=11,<12' || python3 -m pip install --user 'pyslang>=11,<12'
      - name: Native frontend and circuit simulator dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang iverilog ngspice
      - name: Restore pinned C/C++ frontend and parser plugins
        id: clangdev-cache
        uses: actions/cache@v4
        with:
          path: |
            .ci/clangdev
            .ci/clang-plugins
          key: clangdev-${{ runner.os }}-${{ hashFiles('.github/clang-toolchain.lock', 'extractors/c/*_probe.cpp') }}
      - name: Install pinned C/C++ frontend and build parser plugins
        if: steps.clangdev-cache.outputs.cache-hit != 'true'
        env:
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/micromamba-root
        run: |
          set -euo pipefail
          micromamba_archive="$RUNNER_TEMP/micromamba-2.9.0.tar.bz2"
          curl -LsS --fail https://micro.mamba.pm/api/micromamba/linux-64/2.9.0 \
            -o "$micromamba_archive"
          printf '%s  %s\n' \
            8761c382127e6363bd9e0a2451aa3ef90d071a79133f736e2f759a3bf13040dd \
            "$micromamba_archive" | sha256sum --check --status
          tar -xjf "$micromamba_archive" -C "$RUNNER_TEMP" bin/micromamba
          mapfile -t specs < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' .github/clang-toolchain.lock)
          "$RUNNER_TEMP/bin/micromamba" create --yes --no-rc --override-channels \
            --channel conda-forge --prefix "$GITHUB_WORKSPACE/.ci/clangdev" "${specs[@]}"
          mkdir -p "$GITHUB_WORKSPACE/.ci/clang-plugins"
          clangxx="$GITHUB_WORKSPACE/.ci/clangdev/bin/clang++"
          headers="$GITHUB_WORKSPACE/.ci/clangdev/include"
          libs="$GITHUB_WORKSPACE/.ci/clangdev/lib"
          for probe in string_bytes floating_bits record_layout structured_type; do
            "$clangxx" --no-default-config -std=c++17 -fPIC -shared -fno-rtti \
              -I"$headers" "extractors/c/${probe}_probe.cpp" \
              -L"$libs" -Wl,-rpath,"$libs" -Wl,--no-undefined \
              -l:libclang-cpp.so.21.1 -l:libLLVM.so.21.1 \
              -o "$GITHUB_WORKSPACE/.ci/clang-plugins/${probe}_probe.so"
          done
      - name: Export and qualify pinned C/C++ frontend
        env:
          CLANG_ENV: ${{ github.workspace }}/.ci/clangdev
          CLANG_PLUGINS: ${{ github.workspace }}/.ci/clang-plugins
        run: |
          set -euo pipefail
          test -x "$CLANG_ENV/bin/clang"
          test -x "$CLANG_ENV/bin/clang++"
          test -f "$CLANG_PLUGINS/string_bytes_probe.so"
          test -f "$CLANG_PLUGINS/floating_bits_probe.so"
          test -f "$CLANG_PLUGINS/record_layout_probe.so"
          test -f "$CLANG_PLUGINS/structured_type_probe.so"
          version="$($CLANG_ENV/bin/clang --version | head -n 1)"
          test "$version" = 'clang version 21.1.8 (https://github.com/conda-forge/clangdev-feedstock 334cf9a5e6c0331e9f261eaf01fc3568724fcce9)'
          printf '%s\n' "$version"
          sha256sum extractors/c/*_probe.cpp "$CLANG_PLUGINS"/*.so
          {
            echo "LEAN_C_CLANG=$CLANG_ENV/bin/clang"
            echo "LEAN_C_CLANGXX=$CLANG_ENV/bin/clang++"
            echo "LEAN_C_HEADERS=$CLANG_ENV"
            echo "LEAN_C_LIBS=$CLANG_ENV/lib"
            echo "LEAN_C_STRING_BYTES_PLUGIN=$CLANG_PLUGINS/string_bytes_probe.so"
            echo "LEAN_C_FLOATING_BITS_PLUGIN=$CLANG_PLUGINS/floating_bits_probe.so"
            echo "LEAN_C_RECORD_LAYOUT_PLUGIN=$CLANG_PLUGINS/record_layout_probe.so"
            echo "LEAN_C_STRUCTURED_TYPE_PLUGIN=$CLANG_PLUGINS/structured_type_probe.so"
            echo "LEANCPP_CLANG=$CLANG_ENV/bin/clang++"
          } >> "$GITHUB_ENV"
      - name: C parser plugin self-tests
        run: |
          set -euo pipefail
          python3 extractors/c/extract.py --selftest
          python3 tools/leanc --self-test
          python3 harness/c_floating_bits_determinism.py --self-test \
            --clang "$LEAN_C_CLANG" --plugin "$LEAN_C_FLOATING_BITS_PLUGIN"
          python3 harness/c_record_layout_determinism.py --self-test \
            --clang "$LEAN_C_CLANG" --plugin "$LEAN_C_RECORD_LAYOUT_PLUGIN"
          python3 harness/c_structured_type_determinism.py --self-test \
            --clang "$LEAN_C_CLANG" --plugin "$LEAN_C_STRUCTURED_TYPE_PLUGIN"
          source_file="$RUNNER_TEMP/clang-plugin-string.c"
          printf 'int main(void) { const char *s = "x"; return s[0] == 120 ? 0 : 1; }\n' > "$source_file"
          python3 harness/c_string_bytes_determinism.py "$source_file" \
            --clang "$LEAN_C_CLANG" --plugin "$LEAN_C_STRING_BYTES_PLUGIN"
      - name: Restore Mathlib build cache
        run: lake exe cache get
      - name: Full check
        env:
          # The hosted runner terminates the complete build with SIGTERM at
          # the final Python targets when two Lean workers overlap.  Keep the
          # full target set and all gates, but serialize Lean's elaboration so
          # the peak stays below the runner's resource limit.
          LEAN_NUM_THREADS: 1
        timeout-minutes: 320
        run: ./check.sh
      - name: Save lake build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}

  # The README quickstart, verbatim, on both platforms it promises. Nothing
  # else: the full check above is Linux-only. A red macOS row here means the
  # first command a newcomer types is broken there.
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check Python-only proof dependencies
        run: python3 tools/test_python_onboarding.py
      - name: Install elan (README quickstart, step 1)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the tri example (README quickstart, step 3)
        run: MATHLIB_NO_CACHE_ON_UPDATE=1 lake build Examples.python.tri.spec
      - name: Run a whole Python file and compare with CPython (README, next steps)
        run: |
          lake build leanmodels-run
          tools/leanpy --compare harness/scripts/gen_script.py

  # Preserve the outcome of every scheduled/manual run even when a lane is
  # red.  This is the machine-readable red list used by the rename gate.
  red-list:
    if: always()
    needs: [check, quickstart]
    runs-on: ubuntu-24.04
    steps:
      - name: Write red-list artifact
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          QUICKSTART_RESULT: ${{ needs.quickstart.result }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {
              "check": os.environ["CHECK_RESULT"],
              "quickstart": os.environ["QUICKSTART_RESULT"],
          }
          red = [name for name, result in results.items() if result != "success"]
          with open("ci-red-list.json", "w", encoding="utf-8") as out:
              json.dump({"run_id": int(os.environ["RUN_ID"]),
                         "sha": os.environ["SHA"],
                         "event": os.environ["EVENT"],
                         "jobs": results, "red": red}, out, indent=2,
                        sort_keys=True)
              out.write("\n")
          PY
      - name: Publish red-list summary
        run: |
          {
            echo "## CI red list"
            echo
            echo '```json'
            cat ci-red-list.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload red-list artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-red-list-${{ github.run_id }}
          path: ci-red-list.json
